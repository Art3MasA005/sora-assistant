[project]
name = "sora"
version = "0.9.0"
description = "Sora: a personal AI assistant backend (chat, voice, Google automation, RAG, device control)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "sqlalchemy[asyncio]>=2.0.40",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "cryptography>=44",
    "edge-tts>=7.0",
    "pypdf>=5.0",
    "python-multipart>=0.0.18",
    "tzdata>=2024.2",
    # headless Chrome for sites behind a JavaScript bot check (the university notice board)
    "playwright>=1.48",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
# Local speech-to-text on the GPU. Large download (CUDA libs + model), install only if wanted.
local-stt = [
    "faster-whisper>=1.1",
    # CUDA libraries for the GPU on Windows (Linux images ship them with the CUDA base image)
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
